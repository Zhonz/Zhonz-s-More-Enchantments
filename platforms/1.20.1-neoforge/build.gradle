plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group = 'com.zhonz.moreenchantments'
version = '1.0.0'

base { archivesName = "zhonz-more-enchantments-1.20.1-neoforge" }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) } // MC 1.20.1 = Java 17
}

// common 平台无关核心共享: srcDir 指向根工程 common 包
sourceSets {
    main {
        java {
            srcDir '../../src/main/java/com/zhonz/moreenchantments/common'
            exclude 'enchant/EnchantmentKeys.java' // 1.21 数据驱动 ResourceKey, 1.20.1 代码注册用各自键源
        }
    }
}

repositories {
    mavenCentral()
    unimined.neoForgedMaven()
    unimined.wagYourMaven("releases")
    maven { url = "https://maven.shadowsoffire.dev/releases" }
}

unimined.minecraft(sourceSets.main) {
    version project.minecraft_version
    mappings { mojmap() }
    neoForge {
        loader project.neoforge_version
        mixinConfig 'zhonz_more_enchantments.mixins.json'
    }
    defaultRemapJar = true
}

dependencies {
    // Apothic 1.20.1(attributeslib): compileOnly 供移植代码引用 ALObjects(仅编译期, 不进 run classpath)
    compileOnly 'dev.shadowsoffire:ApothicAttributes:1.20.1-1.3.7'
    modImplementation 'dev.shadowsoffire:ApothicAttributes:1.20.1-1.3.7'
    modImplementation 'dev.shadowsoffire:Placebo:1.20.1-8.6.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
